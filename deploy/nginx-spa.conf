# Internal container nginx: serve the static SPA. TLS + security headers
# are handled by the host nginx that reverse-proxies to this container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed assets can be cached forever.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html references the hashed bundles; always revalidate it so
    # new builds are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
